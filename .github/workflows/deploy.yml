name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build

      - name: Create deploy tarball
        run: |
          tar --exclude="node_modules" --exclude=".git" --exclude="logs" -czf deploy.tar.gz .

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to droplet
        run: |
          echo "Uploading tarball..."
          scp -o StrictHostKeyChecking=no deploy.tar.gz root@orchestrator-builder-os:/tmp/agent-stack-deploy.tar.gz

          echo "Running remote deploy..."
          ssh -o StrictHostKeyChecking=no root@orchestrator-builder-os << 'REMOTE_EOF'
            set -e
            APP_DIR="/var/www/agent-stack"
            TAR_FILE="/tmp/agent-stack-deploy.tar.gz"

            echo "[1/5] Stopping service..."
            systemctl stop agent-stack

            echo "[2/5] Backing up .env..."
            if [ -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env" /tmp/.env.backup
            fi

            echo "[3/5] Extracting new code..."
            cd "$APP_DIR"
            tar -xzf "$TAR_FILE" --overwrite
            rm -f "$TAR_FILE"

            echo "[4/5] Restoring .env and installing deps..."
            if [ -f /tmp/.env.backup ]; then
              cp /tmp/.env.backup "$APP_DIR/.env"
              rm /tmp/.env.backup
            fi
            npm install --production
            npx drizzle-kit migrate || true
            chown -R www-data:www-data "$APP_DIR"

            echo "[5/5] Starting service..."
            systemctl start agent-stack
            sleep 5
            systemctl status agent-stack --no-pager || true

            echo ""
            echo "=== App logs (last 5 lines) ==="
            tail -n 5 /var/www/agent-stack/logs/app.log || true

            echo ""
            echo "Deployment complete!"
          REMOTE_EOF

          rm -f deploy.tar.gz

      - name: Health check
        run: |
          sleep 5
          curl -sf https://orchestrator.website/api/health || exit 1
          echo "Health check passed"

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployed successfully to https://orchestrator.website"
          else
            echo "❌ Deploy failed"
          fi
